<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS Cloud</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/butler-profile.js" defer></script>
  <script src="/static/live.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">GEMINI LIVE · NATIVE AUDIO</p>
        <h1>JARVIS Cloud</h1>
      </div>

      <div class="header-actions">
        <label class="voice-picker" for="voice-select">
          <span>Gemini voice</span>
          <select id="voice-select" aria-label="JARVIS Gemini voice">
            <option value="Charon">Charon — Informative</option>
            <option value="Gacrux">Gacrux — Mature</option>
            <option value="Sadaltager">Sadaltager — Knowledgeable</option>
            <option value="Orus">Orus — Firm</option>
            <option value="Alnilam">Alnilam — Firm</option>
            <option value="Algenib">Algenib — Gravelly</option>
            <option value="Iapetus">Iapetus — Clear</option>
            <option value="Rasalgethi">Rasalgethi — Informative</option>
            <option value="Schedar">Schedar — Even</option>
            <option value="Sulafat">Sulafat — Warm</option>
            <option value="Achird">Achird — Friendly</option>
            <option value="Kore">Kore — Firm</option>
            <option value="Puck">Puck — Upbeat</option>
            <option value="Fenrir">Fenrir — Excitable</option>
            <option value="Aoede">Aoede — Breezy</option>
            <option value="Zephyr">Zephyr — Bright</option>
            <option value="Leda">Leda — Youthful</option>
            <option value="Callirrhoe">Callirrhoe — Easy-going</option>
            <option value="Autonoe">Autonoe — Bright</option>
            <option value="Enceladus">Enceladus — Breathy</option>
            <option value="Umbriel">Umbriel — Easy-going</option>
            <option value="Algieba">Algieba — Smooth</option>
            <option value="Despina">Despina — Smooth</option>
            <option value="Erinome">Erinome — Clear</option>
            <option value="Laomedeia">Laomedeia — Upbeat</option>
            <option value="Achernar">Achernar — Soft</option>
            <option value="Pulcherrima">Pulcherrima — Forward</option>
            <option value="Zubenelgenubi">Zubenelgenubi — Casual</option>
            <option value="Vindemiatrix">Vindemiatrix — Gentle</option>
            <option value="Sadachbia">Sadachbia — Lively</option>
          </select>
        </label>

        <button id="voice-preview" class="secondary compact" type="button">Test voice</button>
        <button id="live-toggle" class="secondary" type="button">Start Live</button>

        <span class="status">
          <i id="status-dot" data-state="offline"></i>
          <span id="status-text">Text mode</span>
        </span>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">
        <strong>JARVIS</strong>
        <p>Systems ready, sir. Start Live or press the microphone when you are ready.</p>
      </article>
    </section>

    <form id="chat-form">
      <button
        id="mic"
        class="mic"
        type="button"
        aria-label="Start or stop Gemini Live microphone"
        aria-pressed="false"
        title="Start or stop Gemini Live microphone"
      >🎙</button>
      <textarea id="message" rows="1" placeholder="Type to JARVIS, or use the microphone…" required></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <p id="voice-note" class="note">
      Gemini Live streams microphone audio directly from your browser using a short-lived token.
      Your permanent Gemini API key remains on Render.
    </p>
  </main>
</body>
</html>
